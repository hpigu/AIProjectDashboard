spring:
  main:
    web-application-type: servlet
  application:
    name: project-board
  datasource:
    url: ${BOARD_DB_URL:jdbc:h2:file:./data/board;DB_CLOSE_ON_EXIT=FALSE}
    username: ${BOARD_DB_USER:sa}
    password: ${BOARD_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: project-board
        version: 2.0.0

server:
  address: ${BOARD_HOST:127.0.0.1}
  port: ${BOARD_PORT:8080}

logging:
  # 實際輪替策略（每日/容量雙門檻、gzip 壓縮、保留天數、總容量上限）
  # 由 logback-spring.xml 定義；此處的 file.name 供其讀取路徑基準，
  # 亦作為未設定 logback-spring.xml 時 Spring Boot 預設行為的後備值。
  file:
    name: ${BOARD_LOG_FILE:./logs/board.log}
