<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Project Board</title>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/layout.css">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
  <div id="app">
    <div class="rail" :class="railFlashClass"></div>
    <div class="app-shell">
      <header class="app-header">
        <h1 class="app-title">{{ t('app.title') }}</h1>
        <div class="header-tools">
          <div class="lang-switch" role="group" :aria-label="t('lang.label')">
            <button
              v-for="code in supportedLocales"
              :key="code"
              type="button"
              class="lang-option"
              :class="{ selected: locale === code }"
              :aria-pressed="locale === code ? 'true' : 'false'"
              @click="setLocale(code)"
            >{{ t('lang.' + code) }}</button>
          </div>
          <button
            v-if="notifySupported"
            type="button"
            class="notify-toggle"
            :class="{ 'is-on': notifyOn, 'is-blocked': notifyPermission === 'denied' }"
            :aria-pressed="notifyOn ? 'true' : 'false'"
            :title="notifyHint"
            @click="toggleBlockedNotifications"
          >
            <span class="notify-dot" aria-hidden="true"></span>
            <span>{{ notifyLabel }}</span>
          </button>
          <div class="conn-status">
            <span class="conn-dot" :class="sseConnected ? 'connected' : 'reconnecting'"></span>
            <span>{{ sseConnected ? t('conn.connected') : t('conn.reconnecting') }}</span>
          </div>
        </div>
      </header>

      <level-one
        v-if="currentProjectId === null"
        :projects="projects"
        @select="selectProject"
      ></level-one>

      <level-two
        v-else
        :key="currentProjectId"
        :project-id="currentProjectId"
        :projects="projects"
        :project-summary="selectedProject"
        @back="showProjectList"
        @jump="selectProject"
      ></level-two>
    </div>
  </div>

  <script src="/vendor/vue/vue.global.prod.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
