<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Project Board</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/tokens.css">
  <style>
    .rail {
      position: fixed;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: var(--line);
      z-index: 100;
    }
    .rail.flash-todo    { background: var(--st-todo); }
    .rail.flash-progress{ background: var(--st-progress); }
    .rail.flash-blocked { background: var(--st-blocked); }
    .rail.flash-done    { background: var(--st-done); }
    .rail-flash {
      transition: background 600ms ease-out;
    }

    .app-shell {
      margin-left: 3px;
      padding: 24px 32px;
      max-width: 1100px;
    }

    .app-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .app-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .conn-status {
      font-family: var(--font-data);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .conn-dot.connected    { background: var(--st-done); }
    .conn-dot.reconnecting { background: var(--st-progress); }

    .empty-state {
      color: var(--muted);
      font-size: 15px;
      padding: 48px 8px;
    }

    /* ---- Level 1: 總覽 ---- */
    .project-row {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid transparent;
      border-radius: 4px;
      padding: 14px 18px;
      margin-bottom: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
    }
    .project-row.blocked {
      border-left-color: var(--st-blocked);
    }
    .project-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .project-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .blocked-badge {
      color: var(--st-blocked);
      font-size: 13px;
    }
    .project-meta {
      font-family: var(--font-data);
      font-size: 13px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .segbar {
      display: flex;
      width: 100%;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      background: var(--line);
    }
    .segbar > div {
      transition: flex-grow 400ms ease-out;
    }
    .seg-done     { background: var(--st-done); }
    .seg-progress { background: var(--st-progress); }
    .seg-blocked  { background: var(--st-blocked); }
    .seg-todo     { background: var(--st-todo); }

    /* ---- Level 2: 明細 ---- */
    .board-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 8px;
    }
    .back-btn:hover { color: var(--text); }
    .board-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      margin: 0;
      flex: 1;
    }
    .board-progress {
      font-family: var(--font-data);
      font-size: 14px;
      color: var(--muted);
    }

    .blocked-elsewhere {
      background: var(--surface);
      border: 1px solid var(--st-blocked);
      color: var(--st-blocked);
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    @media (max-width: 700px) {
      .columns { grid-template-columns: 1fr; }
    }
    .column-head {
      font-family: var(--font-data);
      font-size: 12px;
      letter-spacing: 0.05em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .column-count {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 28px;
      margin-bottom: 12px;
    }
    .task-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 4px solid var(--line);
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .task-card.st-TODO        { border-left-color: var(--st-todo); }
    .task-card.st-IN_PROGRESS { border-left-color: var(--st-progress); }
    .task-card.st-BLOCKED     { border-left-color: var(--st-blocked); }
    .task-card.st-DONE        { border-left-color: var(--st-done); }
    .task-id {
      font-family: var(--font-data);
      font-size: 12px;
      color: var(--muted);
    }
    .task-category {
      font-family: var(--font-data);
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }
    .task-card.highlight {
      background: color-mix(in srgb, var(--surface) 70%, var(--st-progress) 30%);
    }

    .column-body {
      position: relative;
    }
    .task-move,
    .task-enter-active,
    .task-leave-active {
      transition: all 400ms ease;
    }
    .task-enter-from {
      opacity: 0;
      transform: translateY(-8px);
    }
    .task-leave-active {
      position: absolute;
      width: 100%;
    }
    .task-leave-to {
      opacity: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .rail-flash { transition: none; }
      .segbar > div { transition: background 200ms ease; }
      .task-move,
      .task-enter-active,
      .task-leave-active {
        transition: background 200ms ease !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="rail" :class="railFlashClass"></div>
    <div class="app-shell">
      <header class="app-header">
        <h1 class="app-title">AI PROJECT BOARD</h1>
        <div class="conn-status">
          <span class="conn-dot" :class="sseConnected ? 'connected' : 'reconnecting'"></span>
          <span>{{ sseConnected ? '連線中' : '重新連線中' }}</span>
        </div>
      </header>

      <level-one
        v-if="currentProjectId === null"
        :projects="projects"
        @select="currentProjectId = $event"
      ></level-one>

      <level-two
        v-else
        :key="currentProjectId"
        :project-id="currentProjectId"
        :projects="projects"
        @back="currentProjectId = null"
        @jump="currentProjectId = $event"
      ></level-two>
    </div>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="/app.js"></script>
</body>
</html>
