<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Project Board</title>
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/layout.css">
</head>
<body>
  <div id="app">
    <div class="rail" :class="railFlashClass"></div>
    <div class="app-shell">
      <header class="app-header">
        <h1 class="app-title">AI PROJECT BOARD</h1>
        <div class="conn-status">
          <span class="conn-dot" :class="sseConnected ? 'connected' : 'reconnecting'"></span>
          <span>{{ sseConnected ? '連線中' : '重新連線中' }}</span>
        </div>
      </header>

      <level-one
        v-if="currentProjectId === null"
        :projects="projects"
        @select="currentProjectId = $event"
      ></level-one>

      <level-two
        v-else
        :key="currentProjectId"
        :project-id="currentProjectId"
        :projects="projects"
        @back="currentProjectId = null"
        @jump="currentProjectId = $event"
      ></level-two>
    </div>
  </div>

  <script src="/vendor/vue/vue.global.prod.js"></script>
  <script src="/app.js"></script>
</body>
</html>
