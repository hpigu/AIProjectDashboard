name: CI

# PR 驗證合併結果，push 驗證 main。其他分支可手動執行。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 同一分支連續推送時，取消還在跑的舊 run，不佔用 runner 額度。
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: 判斷 PR 檢查範圍
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      profile: ${{ steps.classify.outputs.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: 判斷變更檔案
        id: classify
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          profile="$(bash scripts/ci/classify-changes.sh "$PR_BASE" HEAD)"
          printf 'profile=%s\n' "$profile" >> "$GITHUB_OUTPUT"
      - name: 檢查文件變更和安裝版號
        if: steps.classify.outputs.profile == 'docs'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --check "$PR_BASE" HEAD --
          ./scripts/check-versions.sh

  test:
    name: 測試（JDK 21）
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.scope.result == 'success' && needs.scope.outputs.profile == 'full')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      # AGENTS.md 的隔離要求：正式看板的 :8080 與預設資料庫不得拿來跑測試。
      # CI 容器雖然是全新環境，仍照同一組規則設定，讓 CI 與本機指令一致。
      BOARD_PORT: '8081'
      BOARD_DB_URL: 'jdbc:h2:file:./data/ci;DB_CLOSE_ON_EXIT=FALSE'
      BOARD_LOG_FILE: './logs/ci.log'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 設定 JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          problem-matcher: true
          cache: maven

      - name: 執行測試並組裝 JAR
        run: ./mvnw -B verify

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: 以 Chrome 驗證前端與 Git 流程
        env:
          BOARD_HOST: '127.0.0.1'
          BOARD_PORT: '8093'
          BOARD_DB_URL: 'jdbc:h2:mem:ci-browser;DB_CLOSE_DELAY=-1'
          BOARD_MANAGEMENT_TOKEN: workflow-management-fixture-token-at-least-32
          BOARD_ACCEPTANCE_AUTHORITIES: >-
            {"workflow-owner":{"secret":"workflow-owner-fixture-credential-at-least-32","projectIds":[1],"permissions":["PROJECT_POLICY"],"runnerProfiles":[]}}
          BOARD_WORKFLOW_FIXTURE_CONFIRM: isolated
          BOARD_WORKFLOW_CDP_PORT: '9222'
        run: |
          CHROME_BIN="${CHROME_BIN:-$(command -v google-chrome)}"
          TMPDIR="$RUNNER_TEMP/board-browser"
          mkdir "$TMPDIR"
          export CHROME_BIN TMPDIR
          export BOARD_LOG_FILE="$TMPDIR/board.log"
          java -jar target/ai-project-board-backend-*.jar > "$TMPDIR/server.log" 2>&1 &
          board_pid=$!
          trap 'kill "$board_pid" 2>/dev/null || true' EXIT
          "$CHROME_BIN" --headless=new --user-data-dir="$TMPDIR/frontend-chrome" \
            --remote-debugging-port="$BOARD_WORKFLOW_CDP_PORT" --no-first-run about:blank > "$TMPDIR/chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" "$board_pid" 2>/dev/null || true' EXIT

          base_url=http://127.0.0.1:8093
          curl --fail --silent --show-error --retry 60 --retry-delay 1 --retry-connrefused \
            --max-time 2 "$base_url/api/health" > /dev/null
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused \
            --max-time 2 "http://127.0.0.1:$BOARD_WORKFLOW_CDP_PORT/json/version" > /dev/null
          node scripts/frontend-regression/check.mjs --base-url "$base_url" --cdp-port "$BOARD_WORKFLOW_CDP_PORT"
          node scripts/project-workflow-check/browser.mjs --base-url "$base_url"

      - name: 上傳失敗報告
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-and-browser-reports
          path: |
            target/surefire-reports/
            ${{ runner.temp }}/board-browser/server.log
            ${{ runner.temp }}/board-browser/chrome.log
            ${{ runner.temp }}/board-browser/board-workflow-browser-*/*.json
          retention-days: 7

  workers:
    name: Workers 測試與隔離備份演練（Node 22）
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.scope.result == 'success' && (needs.scope.outputs.profile == 'full' || needs.scope.outputs.profile == 'workers'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - name: 安裝鎖定版本（不執行套件安裝腳本）
        working-directory: workers
        run: npm ci --ignore-scripts
      - name: Workers 行為與本機 D1 還原測試
        working-directory: workers
        run: npm test
      - name: 驗證 Web 與 MCP Workers 打包
        working-directory: workers
        run: npm run build:local
      - name: 驗證核准工具、備份與排程模型
        run: |
          node --test scripts/project-workflow-check/*.test.mjs \
            scripts/backup-check/*.test.mjs scripts/worker-scheduling-regression/*.test.js

  scripts:
    name: 啟動腳本靜態檢查
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.scope.result == 'success' && needs.scope.outputs.profile == 'full')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      # 受檢腳本只列一次。原本語法檢查與 shellcheck 各自維護一份清單，新增腳本
      # 要改兩處，改漏一處就靜靜少一半覆蓋——正是這個 workflow 想擋的那種漏。
      SHELL_SCRIPTS: >-
        mvnw
        bin/board bin/board-env.sh bin/backup-db.sh bin/restore-db.sh bin/board-update.sh
        install/install.sh
        scripts/check-versions.sh scripts/shell-check/check.sh
        scripts/check-plugin-parity.sh
        scripts/ci/classify-changes.sh scripts/ci/classify-changes-test.sh
        scripts/install-check/check.sh scripts/install-check/update-fixture.sh
        scripts/release/posix-release-smoke.sh scripts/release/release-assets-fixture.sh
        scripts/release/release-assets.sh

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 確認受檢腳本都有執行權限位元
        run: |
          missing=0
          read -r -a scripts <<< "$SHELL_SCRIPTS"
          for script in "${scripts[@]}"; do
            mode="$(git ls-files -s "${script}" | cut -d' ' -f1)"
            if [ "${mode}" != "100755" ]; then
              echo "::error file=${script}::${script} 在 git 裡的 mode 是 ${mode}，應為 100755。"
              echo "  修法：git update-index --chmod=+x ${script}"
              missing=$((missing + 1))
            fi
          done
          if [ "${missing}" -gt 0 ]; then
            echo "有 ${missing} 支腳本缺少執行權限位元，CI 執行時會是 exit 126。" >&2
            exit 1
          fi
          echo "全部 ${#scripts[@]} 支腳本的權限位元正確。"

      - name: 確認各 manifest 版號與 pom.xml 一致
        run: ./scripts/check-versions.sh

      - name: 確認兩套 plugin 沒有漂移
        run: ./scripts/check-plugin-parity.sh

      - name: bash 函式行為檢查
        run: ./scripts/shell-check/check.sh

      - name: 驗證 PR 檢查分流規則
        run: ./scripts/ci/classify-changes-test.sh

      - name: 驗證安裝、更新與發行資產格式
        run: |
          ./scripts/install-check/check.sh
          ./scripts/release/release-assets-fixture.sh

      - name: bash 語法檢查
        run: |
          read -r -a scripts <<< "$SHELL_SCRIPTS"
          for script in "${scripts[@]}"; do
            echo "檢查 ${script}"
            bash -n "${script}"
          done

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          read -r -a scripts <<< "$SHELL_SCRIPTS"
          shellcheck --severity=warning "${scripts[@]}"

  windows-scripts:
    name: Windows 腳本檢查
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (needs.scope.result == 'success' && needs.scope.outputs.profile == 'full')) }}
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # bin/*.ps1 是 Windows 使用者的唯一入口，而它們碰的是使用者的資料庫檔案。
      # 這個 job 在真正的 Windows 上做語法檢查，並用假的 H2 檔案跑完整的
      # 備份／保留策略／兩種格式還原／各種拒絕路徑。跑的是 Windows PowerShell
      # 5.1（Windows 內建版本），確保不會寫進只有 pwsh 7 才有的語法。
      - name: Windows PowerShell 5.1 檢查
        shell: powershell
        run: .\scripts\windows-check\check.ps1

      - name: PowerShell 7 檢查
        shell: pwsh
        run: .\scripts\windows-check\check.ps1

  dependency-review:
    name: 依賴弱點檢查
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'

    steps:
      - name: 檢查新增／升級的依賴有無已知漏洞
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          # Wrangler、Miniflare 等 Workers 工具列在 devDependencies。
          fail-on-scopes: runtime, development, unknown

  gate:
    name: CI gate
    needs: [scope, test, workers, scripts, windows-scripts, dependency-review]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: 確認必要檢查已通過
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PR_PROFILE: ${{ needs.scope.outputs.profile }}
          JAVA_RESULT: ${{ needs.test.result }}
          WORKERS_RESULT: ${{ needs.workers.result }}
          SHELL_RESULT: ${{ needs.scripts.result }}
          WINDOWS_RESULT: ${{ needs.windows-scripts.result }}
          DEPENDENCIES_RESULT: ${{ needs.dependency-review.result }}
        run: |
          profile=full
          if [[ "$GITHUB_EVENT_NAME" = pull_request ]]; then
            [[ "$SCOPE_RESULT" = success ]] || exit 1
            [[ "$DEPENDENCIES_RESULT" = success ]] || exit 1
            profile="$PR_PROFILE"
          fi
          printf 'Profile=%s Java=%s Workers=%s Shell=%s Windows=%s Dependencies=%s\n' \
            "$profile" "$JAVA_RESULT" "$WORKERS_RESULT" "$SHELL_RESULT" "$WINDOWS_RESULT" "$DEPENDENCIES_RESULT"
          case "$profile" in
            docs)
              [[ "$JAVA_RESULT:$WORKERS_RESULT:$SHELL_RESULT:$WINDOWS_RESULT" = skipped:skipped:skipped:skipped ]]
              ;;
            workers)
              [[ "$JAVA_RESULT:$WORKERS_RESULT:$SHELL_RESULT:$WINDOWS_RESULT" = skipped:success:skipped:skipped ]]
              ;;
            full)
              [[ "$JAVA_RESULT:$WORKERS_RESULT:$SHELL_RESULT:$WINDOWS_RESULT" = success:success:success:success ]]
              ;;
            *) exit 1 ;;
          esac
