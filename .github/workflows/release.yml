name: Release

# 專案原本沒有任何 release：git tag 是空的，也沒有預編 jar，任何人想用都得
# 自己備妥 JDK 21 並現場組裝（首次啟動會多花數十秒到數分鐘，且需要網路抓
# Maven 依賴）。這個 workflow 讓 vX.Y.Z 的 tag 直接產出可下載的 jar。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要發布的 tag（例如 v3.0.0），需已存在'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 組裝並發布
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      BOARD_PORT: '8081'
      BOARD_DB_URL: 'jdbc:h2:file:./data/ci;DB_CLOSE_ON_EXIT=FALSE'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 設定 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 擋掉「tag 打在錯的 commit 上」——實際發生過：v3.1.0 打在還沒合併版號變更的
      # main 上，release 於是產出一個名為 ai-project-board-backend-3.0.0.jar 的檔案
      # 掛在 v3.1.0 底下，而且整個流程一路綠燈沒有任何人被告知。
      #
      # 放在測試之前：這一項失敗代表整個 release 從一開始就不該進行，沒必要先花
      # 幾分鐘跑完測試再來發現。
      - name: 確認 tag 與 pom.xml 版號一致
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          pom_version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          if [ "v${pom_version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} 與 pom.xml 的版本 ${pom_version} 不一致。" >&2
            echo "多半是 tag 打在還沒合併版號變更的 commit 上。若照舊發布，會產出一個" >&2
            echo "名稱與 tag 對不上的 jar，下載的人無從得知手上的是哪一版。" >&2
            echo "處理方式：先把含版號變更的分支合併進 main，刪掉這個 tag 後重打。" >&2
            exit 1
          fi
          echo "tag ${TAG} 與 pom.xml 版本 ${pom_version} 一致。"

      # 發布前一定要跑測試：release 是唯一會被陌生人直接下載執行的產物，
      # 不能因為「tag 推上去了」就跳過驗證。
      - name: 執行測試
        run: ./mvnw -B test

      - name: 組裝 jar
        run: ./mvnw -B -DskipTests package

      - name: 產生 checksum
        id: artifacts
        run: |
          set -euo pipefail
          jar_path="$(find target -maxdepth 1 -name '*.jar' ! -name '*.original' | head -n1)"
          if [ -z "${jar_path}" ]; then
            echo "找不到組裝好的 jar" >&2
            exit 1
          fi
          sha256sum "${jar_path}" | awk -v name="$(basename "${jar_path}")" \
            '{print $1 "  " name}' > "${jar_path}.sha256"
          echo "jar_path=${jar_path}" >> "$GITHUB_OUTPUT"

      - name: 建立 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          JAR_PATH: ${{ steps.artifacts.outputs.jar_path }}
        # 用內建的 gh CLI 與 GITHUB_TOKEN，不引入第三方 action：release 是
        # 供人下載執行的產物，這條路徑上的依賴愈少愈好。
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            "${JAR_PATH}" "${JAR_PATH}.sha256" \
            --title "${TAG}" \
            --generate-notes \
            --notes "執行方式：JDK 21 環境下 \`java -jar $(basename "${JAR_PATH}")\`，
            或 clone repo 後執行 \`bin/board start\`（會自動找 jar、檢查埠號與鎖檔、
            啟動前備份）。下載後可用附帶的 .sha256 驗證檔案完整性。

            預設只監聽 127.0.0.1，且 /mcp 沒有 server-side 認證，不要在未自行
            加上認證層的情況下對外暴露。"
