name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要發布的既有 stable tag（例如 v3.1.1）'
        required: true
        type: string

# Build jobs never receive write credentials. Only the final job needs to create and
# publish a GitHub Release after all four independently validated artifacts arrive.
permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release_ref.outputs.tag }}
      version: ${{ steps.release_ref.outputs.version }}
      commit: ${{ steps.release_ref.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify stable tag, exact checkout, version, and thin plugin metadata
        id: release_ref
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG#refs/tags/}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::${tag} is not a stable vX.Y.Z tag"; exit 1; }
          tag_commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          [ "$head_commit" = "$tag_commit" ] || { echo "::error::checkout ${head_commit} is not the peeled commit for ${tag} (${tag_commit})"; exit 1; }
          version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          [ "v${version}" = "$tag" ] || { echo "::error::tag ${tag} does not match pom.xml version ${version}"; exit 1; }
          ./scripts/check-versions.sh
          ./scripts/check-plugin-parity.sh
          grep -Fq '"source": "./plugin"' .claude-plugin/marketplace.json || { echo '::error::Claude marketplace no longer points at ./plugin'; exit 1; }
          grep -Fq '"path": "./plugins/ai-project-board"' .agents/plugins/marketplace.json || { echo '::error::Codex marketplace no longer points at ./plugins/ai-project-board'; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${head_commit}" >> "$GITHUB_OUTPUT"

  linux-x64:
    name: Linux x64 build and self-validate
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BOARD_PORT: '18081'
      BOARD_DB_URL: 'jdbc:h2:file:./data/release-linux;DB_CLOSE_ON_EXIT=FALSE'
      BOARD_LOG_FILE: './logs/release-linux.log'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        run: |
          set -euo pipefail
          ./mvnw -B test
          ./mvnw -B -DskipTests package
          version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          mkdir release-assets
          cp "target/ai-project-board-backend-${version}.jar" "release-assets/ai-project-board-backend-linux-x64-${version}.jar"
          ./scripts/release/release-assets.sh validate-platform --version "$version" --platform linux-x64 --directory release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: release-assets/ai-project-board-backend-linux-x64-*.jar
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 build and self-validate
    needs: preflight
    runs-on: macos-15
    timeout-minutes: 30
    env:
      BOARD_PORT: '18082'
      BOARD_DB_URL: 'jdbc:h2:file:./data/release-macos-arm64;DB_CLOSE_ON_EXIT=FALSE'
      BOARD_LOG_FILE: './logs/release-macos-arm64.log'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Gate native runner architecture
        run: test "$(uname -m)" = arm64
      - name: Test and package
        run: |
          set -euo pipefail
          ./mvnw -B test
          ./mvnw -B -DskipTests package
          version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          mkdir release-assets
          cp "target/ai-project-board-backend-${version}.jar" "release-assets/ai-project-board-backend-macos-arm64-${version}.jar"
          ./scripts/release/release-assets.sh validate-platform --version "$version" --platform macos-arm64 --directory release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: release-assets/ai-project-board-backend-macos-arm64-*.jar
          if-no-files-found: error

  macos-x64:
    name: macOS x64 build and self-validate
    needs: preflight
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      BOARD_PORT: '18083'
      BOARD_DB_URL: 'jdbc:h2:file:./data/release-macos-x64;DB_CLOSE_ON_EXIT=FALSE'
      BOARD_LOG_FILE: './logs/release-macos-x64.log'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Gate native runner architecture
        run: test "$(uname -m)" = x86_64
      - name: Test and package
        run: |
          set -euo pipefail
          ./mvnw -B test
          ./mvnw -B -DskipTests package
          version="$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)"
          mkdir release-assets
          cp "target/ai-project-board-backend-${version}.jar" "release-assets/ai-project-board-backend-macos-x64-${version}.jar"
          ./scripts/release/release-assets.sh validate-platform --version "$version" --platform macos-x64 --directory release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-x64
          path: release-assets/ai-project-board-backend-macos-x64-*.jar
          if-no-files-found: error

  windows-x64:
    name: Windows x64 build and self-validate
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      BOARD_PORT: '18084'
      BOARD_DB_URL: 'jdbc:h2:file:./data/release-windows;DB_CLOSE_ON_EXIT=FALSE'
      BOARD_LOG_FILE: './logs/release-windows.log'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test, package, and Windows jlink smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw "Windows x64 runner required; got $env:PROCESSOR_ARCHITECTURE" }
          .\mvnw.cmd -B test
          .\mvnw.cmd -B -DskipTests package
          [xml]$pom = Get-Content pom.xml
          $version = $pom.project.version
          $jar = "target\ai-project-board-backend-$version.jar"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\release\package-windows-x64.ps1 -ServerJar $jar -JdkHome $env:JAVA_HOME -Version $version -OutputDirectory target\release
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-check\package-fixture.ps1 -ServerJar $jar -Version $version
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows-check\release-check.ps1 -ReleaseZip "target\release\ai-project-board-backend-windows-x64-$version.zip" -Smoke
          New-Item -ItemType Directory -Path release-assets | Out-Null
          Copy-Item "target\release\ai-project-board-backend-windows-x64-$version.zip" release-assets
          bash scripts/release/release-assets.sh validate-platform --version $version --platform windows-x64 --directory release-assets
          if ($LASTEXITCODE -ne 0) { throw 'shared release asset validation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: release-assets/ai-project-board-backend-windows-x64-*.zip
          if-no-files-found: error

  publish:
    name: Assemble and publish complete release
    needs: [preflight, linux-x64, macos-arm64, macos-x64, windows-x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Assemble and validate deterministic checksums
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/release/release-assets.sh assemble --version "$VERSION" --directory release-assets
          ./scripts/release/release-assets.sh validate --version "$VERSION" --directory release-assets
      - name: Refuse to overwrite an existing release, including draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/release.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          case "$status" in
            404) ;;
            200) echo "::error::release ${TAG} already exists (including drafts); refusing to overwrite, delete, or patch it"; exit 1 ;;
            *) echo "::error::could not safely determine whether release ${TAG} already exists (GitHub API HTTP ${status})"; exit 1 ;;
          esac
      - name: Create draft and upload the five validated assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --draft --title "$TAG" \
            --notes "Stable server release for tag ${TAG}, built from ${COMMIT}. Download the platform-specific server artifact and verify it against ai-project-board-backend-${VERSION}-SHA256SUMS.txt before installation. The included Claude and Codex plugins remain thin clients."
          gh release upload "$TAG" \
            "release-assets/ai-project-board-backend-linux-x64-${VERSION}.jar" \
            "release-assets/ai-project-board-backend-macos-arm64-${VERSION}.jar" \
            "release-assets/ai-project-board-backend-macos-x64-${VERSION}.jar" \
            "release-assets/ai-project-board-backend-windows-x64-${VERSION}.zip" \
            "release-assets/ai-project-board-backend-${VERSION}-SHA256SUMS.txt"
      - name: Re-verify draft assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' \
            "ai-project-board-backend-linux-x64-${VERSION}.jar" \
            "ai-project-board-backend-macos-arm64-${VERSION}.jar" \
            "ai-project-board-backend-macos-x64-${VERSION}.jar" \
            "ai-project-board-backend-windows-x64-${VERSION}.zip" \
            "ai-project-board-backend-${VERSION}-SHA256SUMS.txt" | LC_ALL=C sort)"
          actual="$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          [ "$actual" = "$expected" ] || { echo '::error::draft asset list is incomplete or contains unexpected files'; exit 1; }
          gh release edit "$TAG" --draft=false
