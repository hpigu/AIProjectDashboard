version: 2

# 每週檢查 Java、Workers 與 GitHub Actions 的依賴更新。
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Spring Boot 的模組必須整組一起升，分開升版容易產生版本不一致。
      spring:
        patterns:
          - 'org.springframework.*'
          - 'org.springframework.boot:*'
          - 'org.springframework.ai:*'
    commit-message:
      prefix: 'deps'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'

  - package-ecosystem: npm
    directory: /workers
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(workers)'
